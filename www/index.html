<link rel="icon" type="image/png" href="icons/icon-192.png"><style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{overscroll-behavior:none;-webkit-touch-callout:none;scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style>
/* Layout: one narrow column like the iOS stopwatch. Rank card on top, clock, versus panel, one huge LAP disc, lap log, ladder, top 10. */
:root {
  --bg: #000;
  --panel: #131315;
  --disc: #2c2c2e;
  --disc-hot: #444447;
  --line: #2a2a2d;
  --fg: #fff;
  --dim: #8e8e93;
  --accent: #ff9f0a;
  --go: #30d158;
  --go-bg: #0e2a17;
  --stop: #ff453a;
  --stop-bg: #2e1210;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
  --sans: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--fg); font-family: var(--sans); font-size: 15px;
  padding-block: 12px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* nickname screen */
#nickScreen { min-height: 78vh; justify-content: center; gap: 22px; }
#nickScreen h1 { margin: 0; font-size: 2rem; font-weight: 700; line-height: 1.25; text-wrap: balance; }
#nickScreen p { margin: 0; color: var(--dim); line-height: 1.6; }
.nickrow { display: flex; gap: 10px; }
#nickInput { flex: 1; min-width: 0; font: inherit; font-size: 1.25rem; padding: 14px 16px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.btn-main { background: var(--accent); color: #1a1000; font-weight: 700; padding: 0 22px; border-radius: 14px; font-size: 1.05rem; }
.hint-err { color: var(--stop); min-height: 1.2em; font-size: .9rem; }

/* tier badge: hexagon with a ring, colors come from the tier */
.badge { --s: 56px; width: var(--s); height: var(--s); position: relative; flex: none; clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); background: var(--ring, #555); }
.badge i { position: absolute; inset: calc(var(--s) * .06); clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); background: linear-gradient(150deg, var(--c1), var(--c2)); display: grid; place-items: center; font-style: normal; font-family: var(--mono); font-weight: 500; font-size: calc(var(--s) * .38); color: var(--tf, #111); }
.badge.sm { --s: 26px; }
.badge.xs { --s: 22px; }
.badge.lg { --s: 72px; }

/* rank card */
.rank { display: flex; align-items: center; gap: 14px; background: var(--panel); border-radius: 18px; padding: 12px 14px; }
.rank .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.rank .l1 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.rank .tn { font-weight: 700; font-size: 1.15rem; white-space: nowrap; }
.rank .lv { font-family: var(--mono); font-weight: 500; color: var(--accent); white-space: nowrap; }
.xpbar { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.xpbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.rank .l3 { display: flex; justify-content: space-between; gap: 8px; color: var(--dim); font-size: .78rem; }
.rank .l3 span:first-child { font-family: var(--mono); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.me-chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--panel); border-radius: 999px; max-width: 60%; }
.me-chip b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.me-chip span { color: var(--dim); font-size: .8rem; white-space: nowrap; }
.online { display: inline-flex; align-items: center; gap: 7px; color: var(--dim); font-size: .85rem; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.dot.on { background: var(--go); }

/* clock */
.clock { font-family: var(--mono); font-weight: 300; font-size: clamp(3.4rem, 17vw, 5.6rem); text-align: center; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 2px; }
.bar { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.status { min-height: 3rem; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--dim); font-size: .95rem; text-wrap: balance; }
.status.big { font-family: var(--mono); font-weight: 500; font-size: 3rem; color: var(--accent); }
.status.live { color: var(--fg); font-weight: 500; }

/* lobby list and versus panel share one box */
.board { background: var(--panel); border-radius: 16px; padding: 4px 14px; max-height: 9.5rem; overflow-y: auto; }
.prow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.prow:last-child { border-bottom: 0; }
.prow .rk { width: 1.3rem; color: var(--dim); font-family: var(--mono); font-size: .85rem; }
.prow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .nm em { font-style: normal; color: var(--accent); font-size: .78rem; margin-left: 6px; }
.prow .ct { font-family: var(--mono); font-size: 1.05rem; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.prow .ct.wait { color: var(--dim); font-size: .8rem; font-family: var(--sans); font-weight: 400; }
.prow.me .nm { color: var(--accent); }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; padding: 10px 0 12px; }
.vs .side { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.vs .side b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.vs .side small { color: var(--dim); font-size: .75rem; }
.vs .num { font-family: var(--mono); font-weight: 500; font-size: 2.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.vs .side.me .num { color: var(--accent); }
.vs .x { color: var(--dim); font-family: var(--mono); }
.tug { grid-column: 1 / -1; height: 6px; border-radius: 6px; background: var(--stop); overflow: hidden; }
.tug i { display: block; height: 100%; width: 50%; background: var(--accent); transition: width .1s; }

/* buttons */
.pad { display: flex; justify-content: center; align-items: center; gap: 28px; padding: 4px 0; }
.disc { border-radius: 50%; display: grid; place-items: center; text-align: center; user-select: none; -webkit-user-select: none; position: relative; }
.disc::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; border: 1px solid rgba(255,255,255,.08); pointer-events: none; }
#lapBtn { width: min(46vw, 190px); aspect-ratio: 1; background: var(--disc); transition: transform .05s, background .05s; }
#lapBtn.hot { background: var(--disc-hot); }
#lapBtn:active, #lapBtn.press { transform: scale(.93); background: #5a5a5e; }
#lapBtn:disabled { background: #1c1c1e; color: var(--dim); cursor: default; transform: none; }
#lapBtn .t { font-size: 1.1rem; }
#lapBtn .n { font-family: var(--mono); font-size: 2.6rem; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
#goBtn { width: 88px; aspect-ratio: 1; background: var(--go-bg); color: var(--go); font-weight: 700; font-size: 1.05rem; }
#goBtn.stop { background: var(--stop-bg); color: var(--stop); }
.pill { align-self: center; padding: 9px 18px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--dim); font-size: .85rem; }
.pill:disabled { opacity: .4; cursor: default; }

/* lap log */
.sec-title { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 0 0; font-size: .95rem; font-weight: 700; }
.sec-title span { color: var(--dim); font-weight: 400; font-size: .8rem; }
.laps { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.lrow { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 1.05rem; }
.lrow > :nth-child(2) { text-align: center; }
.lrow > :nth-child(3) { text-align: right; }
.lrow.head { color: var(--dim); font-family: var(--sans); font-size: .8rem; }
.lrow.best { color: var(--go); }
.lrow.worst { color: var(--stop); }
.empty { color: var(--dim); font-size: .9rem; padding: 14px 2px; line-height: 1.6; }

/* ladder */
.ladder { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 8px; }
.ladder .st { flex: 1 0 58px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 12px; border: 1px solid transparent; color: var(--dim); font-size: .7rem; text-align: center; }
.ladder .st.cur { border-color: var(--accent); color: var(--fg); background: var(--panel); }
.ladder .st.done { opacity: .55; }
.ladder .st:not(.cur):not(.done) { opacity: .85; }
.hof { background: var(--panel); border-radius: 16px; padding: 4px 14px; max-height: 24rem; overflow-y: auto; }
.hof .prow .rk { width: 1.8rem; }
.hof .prow.r1 .rk { color: #ffd60a; font-weight: 500; }
.hof .prow.r2 .rk { color: #d1d1d6; font-weight: 500; }
.hof .prow.r3 .rk { color: #e8a56a; font-weight: 500; }
.tabs { display: flex; gap: 6px; }
.tabs button { flex: 1; padding: 9px 0; border-radius: 999px; background: var(--panel); color: var(--dim); font-weight: 500; border: 1px solid var(--line); }
.tabs button[aria-pressed="true"] { background: var(--disc); color: var(--accent); font-weight: 700; }
.myrank { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--panel); border-radius: 14px; padding: 12px 14px; font-size: .9rem; }
.myrank b { font-family: var(--mono); font-weight: 500; color: var(--accent); font-size: 1.15rem; }
.myrank span { color: var(--dim); font-size: .8rem; text-align: right; }
.rule { color: var(--dim); font-size: .8rem; line-height: 1.6; }

/* result sheet */
#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; padding: 0 max(8px, env(safe-area-inset-left, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px)); pointer-events: none; }
#sheet .card { pointer-events: auto; width: 100%; max-width: 520px; background: #1c1c1e; border: 1px solid #3a3a3c; border-radius: 22px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -12px 40px rgba(0,0,0,.7); max-height: 80vh; overflow-y: auto; }
#sheet h2 { margin: 0; font-size: 1.6rem; font-weight: 700; text-wrap: balance; }
#sheet .sub { color: var(--dim); font-size: .9rem; line-height: 1.5; }
.shift { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 6px 0; }
.shift .ar { color: var(--dim); font-size: 1.4rem; }
.shift .nm { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .85rem; }
.score { display: flex; justify-content: center; align-items: baseline; gap: 12px; font-family: var(--mono); }
.score b { font-size: 2.2rem; font-weight: 500; }
.score .me { color: var(--accent); }
.gain { text-align: center; color: var(--dim); font-size: .85rem; }
.gain b { color: var(--accent); font-family: var(--mono); font-weight: 500; }
.actions { display: flex; gap: 10px; margin-top: 2px; }
.actions button { flex: 1; padding: 13px 0; border-radius: 14px; font-weight: 700; }
.actions .again { background: var(--go-bg); color: var(--go); }
.actions .close { background: var(--disc); }

/* mid-round level-up toast */
#toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -140%); z-index: 30; background: var(--accent); color: #1a1000; font-weight: 700; padding: 10px 20px; border-radius: 999px; transition: transform .25s; pointer-events: none; white-space: nowrap; }
#toast.on { transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { #lapBtn, #toast, .xpbar i { transition: none; } }
</style>

<div class="wrap" id="nickScreen" hidden>
  <h1>닉네임을 정하고<br>스피드 랩 레전드에 입장해요</h1>
  <p>같은 티어끼리 10초 동안 랩 버튼을 더 많이 누르면 이겨요. 이기면 승급하고, 지면 한 단계 내려가요. 처음엔 언랭크로 시작해요.</p>
  <div class="tabs" id="regionTabs" role="group" aria-label="지역" hidden>
    <button type="button" data-r="KR" aria-pressed="false">국내 (한국)</button>
    <button type="button" data-r="XX" aria-pressed="false">해외</button>
  </div>
  <form class="nickrow" id="nickForm">
    <input id="nickInput" maxlength="10" autocomplete="off" autocapitalize="off" placeholder="닉네임 (10자 이내)" aria-label="닉네임">
    <button class="btn-main" type="submit">입장</button>
  </form>
  <div class="hint-err" id="nickErr" role="alert"></div>
</div>

<div class="wrap" id="gameScreen" hidden>
  <div class="top">
    <button class="me-chip" id="nickBtn" aria-label="닉네임 변경"><b id="meName"></b><span>변경</span></button>
    <div class="online"><i class="dot" id="onDot"></i><span id="onTxt">혼자 연습</span></div>
  </div>

  <div class="rank" id="rankCard"></div>

  <div class="clock" id="clock">00:00.00</div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="status" id="status"></div>

  <div class="board" id="board"></div>

  <div class="pad">
    <button class="disc" id="lapBtn" disabled aria-label="랩 누르기"><span><span class="t">랩</span><br><span class="n" id="myCount">0</span></span></button>
    <button class="disc" id="goBtn">대결</button>
  </div>
  <button class="pill" id="botBtn">AI 연습전 (티어 변화 없음)</button>

  <div class="sec-title">내 랩 기록 <span id="lapNote"></span></div>
  <div class="laps" id="laps"></div>

  <div class="sec-title">티어 사다리 <span>한 칸씩 올라가요</span></div>
  <div class="ladder" id="ladder"></div>
  <div class="rule">승리하면 브론즈 1, 2, 3 순서로 오르고 다음 티어로 넘어가요. 같은 티어끼리만 매칭돼요. 랩을 누를 때마다 경험치가 쌓여 레벨이 올라요.</div>

  <div class="sec-title" hidden>랭킹 <span>티어, 경험치 순 · TOP 50</span></div>
  <div class="tabs" id="rankTabs" role="group" aria-label="랭킹 범위" hidden>
    <button data-t="world" aria-pressed="true">세계 랭킹</button>
    <button data-t="kr" aria-pressed="false">국내 랭킹</button>
  </div>
  <div class="myrank" id="myRank" hidden></div>
  <div class="hof" id="hof" hidden><div class="empty">랭킹을 불러오는 중이에요.</div></div>
</div>

<div id="toast" role="status"></div>

<div id="sheet" hidden>
  <div class="card">
    <h2 id="rTitle"></h2>
    <div class="score" id="rScore"></div>
    <div class="shift" id="rShift"></div>
    <div class="sub" id="rSub"></div>
    <div class="gain" id="rGain"></div>
    <div class="actions">
      <button class="again" id="rAgain">한 판 더</button>
      <button class="close" id="rClose">닫기</button>
    </div>
  </div>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var DUR = 10, MAXSTEP = 24;
  var COUNTRY = 'XX';
  try { if (Intl.DateTimeFormat().resolvedOptions().timeZone === 'Asia/Seoul') COUNTRY = 'KR'; } catch (e) {}
  var hofAll = [], hofTab = 'world', regionChosen = false;
  try { var rg = localStorage.getItem('lapbattle.region'); if (rg === 'KR' || rg === 'XX') { COUNTRY = rg; regionChosen = true; } } catch (e) {}
  var TIERS = [
    { n: '브론즈', c1: '#f0a56c', c2: '#8a4f22', ring: '#ffd0a6', tf: '#1d0f05' },
    { n: '실버', c1: '#f3f6fa', c2: '#9aa3b2', ring: '#ffffff', tf: '#111111' },
    { n: '골드', c1: '#ffe27a', c2: '#d49a14', ring: '#fff3b8', tf: '#2a1c00' },
    { n: '다이아', c1: '#a8ecff', c2: '#2fa8e6', ring: '#e2f8ff', tf: '#00202e' },
    { n: '플래티넘', c1: '#8ff5d6', c2: '#1fae8e', ring: '#d3fff2', tf: '#00241b' },
    { n: '오닉스', c1: '#5b5b66', c2: '#17171c', ring: '#a3a3b3', tf: '#ffffff' },
    { n: '네메시스', c1: '#ff7a8f', c2: '#c0102f', ring: '#ffc0ca', tf: '#ffffff' },
    { n: '아크네메시스', c1: '#d7a8ff', c2: '#6a1fd1', ring: '#ffe3ff', tf: '#ffffff' }
  ];
  function tierOf(step) { return step <= 0 ? -1 : Math.floor((step - 1) / 3); }
  function divOf(step) { return (step - 1) % 3 + 1; }
  function label(step) { return step <= 0 ? '언랭크' : TIERS[tierOf(step)].n + ' ' + divOf(step); }
  function levelInfo(xp) {
    var L = 1, need = 60;
    while (xp >= need) { xp -= need; L++; need = 60 + 25 * (L - 1); }
    return { L: L, cur: xp, need: need };
  }

  var nick = '', P = { step: 0, xp: 0, wins: 0, losses: 0 };
  var phase = 'idle'; // idle | searching | countdown | running | done
  var startAt = 0, taps = 0, laps = [], opp = null, ranked = false, settled = false, forfeit = false;
  var lastSeenStart = 0, raf = 0, searchTimer = 0, settleTimer = 0, room = null, db = null, uid = null, connected = false;
  var searchBegan = 0, unsubHof = null, xpStart = 0, lvStart = 1, stepStart = 0, lastBoard = 0, toastTimer = 0;

  try { nick = localStorage.getItem('lapbattle.nick') || ''; } catch (e) {}
  try { var sp = JSON.parse(localStorage.getItem('lapbattle.profile') || 'null'); if (sp && typeof sp.step === 'number') P = { step: Math.max(0, Math.min(MAXSTEP, sp.step | 0)), xp: Math.max(0, sp.xp | 0), wins: sp.wins | 0, losses: sp.losses | 0 }; } catch (e) {}

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(ms) {
    var cs = Math.floor(ms / 10), m = Math.floor(cs / 6000), s = Math.floor((cs % 6000) / 100), c = cs % 100;
    return pad2(m) + ':' + pad2(s) + '.' + pad2(c);
  }
  function badge(step, size) {
    var t = tierOf(step), T = t < 0 ? { c1: '#6b6b70', c2: '#2c2c2e', ring: '#8e8e93', tf: '#fff' } : TIERS[t];
    var b = el('div', 'badge' + (size ? ' ' + size : ''));
    b.style.setProperty('--c1', T.c1); b.style.setProperty('--c2', T.c2); b.style.setProperty('--ring', T.ring); b.style.setProperty('--tf', T.tf);
    var i = el('i', '', step <= 0 ? '?' : String(divOf(step)));
    b.appendChild(i);
    return b;
  }
  function saveLocal() { try { localStorage.setItem('lapbattle.profile', JSON.stringify(P)); } catch (e) {} }
  function myTier() { return Math.max(0, tierOf(P.step)); }
  function myPeer() {
    if (!room) return null;
    var ps = room.peers();
    for (var i = 0; i < ps.length; i++) if (ps[i].isMe && ps[i].sameTab) return ps[i].peer;
    return null;
  }
  function sync(extra) {
    if (!room) return;
    var o = { nick: nick || null, tier: myTier(), step: P.step };
    if (extra) for (var k in extra) o[k] = extra[k];
    room.presence(o);
  }

  /* ---------- screens ---------- */
  function show() {
    var has = !!nick;
    $('nickScreen').hidden = has;
    $('gameScreen').hidden = !has;

        if (typeof d.xp === 'number' && d.xp >= P.xp && typeof d.step === 'number') {
          P = { step: Math.max(0, Math.min(MAXSTEP, d.step | 0)), xp: d.xp | 0, wins: d.wins | 0, losses: d.losses | 0 };
          saveLocal(); sync(); if (!$('gameScreen').hidden && phase === 'idle') renderAll();
          if (!regionChosen && (d.country === 'KR' || d.country === 'XX')) { COUNTRY = d.country; markRegion(); }
          else if (d.country !== COUNTRY && P.step > 0) saveRemote();
        }
      }
    } catch (e) {}
  }
  async function saveRemote() {
    if (!db || !uid) return;
    try {
      var ref = db.doc('scores/' + uid), snap = await ref.get();
      var d = snap.exists ? Object.assign({}, snap.data()) : {};
      d.country = COUNTRY; d.nick = nick; d.step = P.step; d.xp = P.xp; d.wins = P.wins; d.losses = P.losses;
      await ref.set(d);
    } catch (e) {}
  }

  /* ---------- input ---------- */
  var lap = $('lapBtn');
  lap.addEventListener('pointerdown', function (e) { e.preventDefault(); tap(); });
  lap.addEventListener('click', function (e) { if (e.detail === 0) tap(); });
  $('goBtn').addEventListener('click', function () { if (phase === 'idle' || phase === 'done') findMatch(); else abort(); });
  $('botBtn').addEventListener('click', startBot);
  document.addEventListener('keydown', function (e) {
    if (e.repeat) return;
    if ((e.code === 'Space' || e.code === 'Enter') && phase === 'running' && document.activeElement && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault(); lap.classList.add('press'); tap();
    }
  });
  document.addEventListener('keyup', function (e) { if (e.code === 'Space' || e.code === 'Enter') lap.classList.remove('press'); });

  function markRegion() {
    var bs = $('regionTabs').querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) bs[i].setAttribute('aria-pressed', bs[i].getAttribute('data-r') === COUNTRY ? 'true' : 'false');
  }
  $('regionTabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    COUNTRY = b.getAttribute('data-r') === 'KR' ? 'KR' : 'XX'; regionChosen = true;
    try { localStorage.setItem('lapbattle.region', COUNTRY); } catch (e2) {}
    markRegion();
  });
  $('rankTabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    hofTab = b.getAttribute('data-t') === 'kr' ? 'kr' : 'world';
    var bs = $('rankTabs').querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) bs[i].setAttribute('aria-pressed', bs[i] === b ? 'true' : 'false');
    renderHof();
  });

  /* ---------- boot: page works alone, room and db light up later ---------- */
  markRegion();
  show();
  var c = window.claude;
  if (c && c.use) {
    c.use('db').then(function (d) { db = d; if (!$('gameScreen').hidden) subscribeHof(); return c.use('user'); })
      .then(function (u) { return u && u.id ? u.id() : null; })
      .then(function (id) { uid = id || null; return loadRemote(); }).catch(function () {});
    c.use('room').then(function (r) {
      if (!r) return;
      room = r;
      r.onConnection(function (ok) { connected = ok; renderOnline(); });
      sync({ searching: false, rid: 0, taps: 0 });
      r.onPeers(onPeers);
      renderAll();
    }).catch(function () {});
  }
})();
</script>

<script>
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
</script>
